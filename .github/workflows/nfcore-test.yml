name: nf-core module tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  nf-core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '24.04.1'

      - name: Set up nf-core tools
        run: pip install nf-core==4.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run nf-core modules lint
        run: nf-core modules lint reportree --dir .

      - name: Run Python unit tests
        run: python3 tests/test_module.py

      - name: Run nf-test (local, no docker)
        run: nf-test test --tag reportree --profile local