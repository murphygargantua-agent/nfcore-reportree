name: "reportree"
description: "ReporTree: a surveillance-oriented tool for pathogen genetic cluster analysis and epidemiological data linkage"
keywords:
  - pathogen
  - surveillance
  - clustering
  - epidemiology
  - tree
  - cgMLST
  - wgMLST
  - SNP
  - phylogenetics
tools:
  - reportree:
      description: |
        ReporTree is a flexible pipeline that facilitates the detection of genetic clusters
        and their linkage to epidemiological data. It obtains genetic clusters at any
        threshold level(s) of a tree, SNP or cg/wgMLST allele matrix, VCF files, sequence
        alignment, or distance matrix, and produces summary reports with statistics/trends
        for the derived genetic clusters.

        ReporTree is implemented in Python 3.8 and comprises six main scripts orchestrated
        by reportree.py. It relies on external tools including cgmlst-dists, ete3, grapetree,
        treecluster, snp-sites, vcf2mst, and ComparingPartitions.
      homepage: https://github.com/insapathogenomics/ReporTree
      documentation: https://github.com/insapathogenomics/ReporTree/wiki
      tool_dev_url: https://github.com/insapathogenomics/ReporTree
      doi: "10.1186/s13073-023-01196-1"
      licence:
        - "GPL-3.0-only"
      identifier: biotools:reportree

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1', single_end:false ]
    - metadata:
        type: file
        description: Metadata table in TSV format (required, no headers with blank spaces)
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - allele_profile:
        type: file
        description: Allele/SNP profile matrix in TSV format (optional)
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - partitions:
        type: file
        description: Partitions table (matrix with genetic clusters) in TSV format (optional)
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - tree:
        type: file
        description: Newick tree file for obtaining genetic clusters (optional)
        pattern: "*.{newick,nwk,tree}"
        ontologies: []
    - alignment:
        type: file
        description: Sequence alignment for conversion into profile (optional)
        pattern: "*.{fasta,fna,fa,aln}"
        ontologies: []
    - vcf:
        type: file
        description: VCF file for conversion into profile (optional)
        pattern: "*.{vcf,vcf.gz}"
        ontologies: []
    - variants:
        type: file
        description: TSV with list of mutations per sample for conversion into profile (optional)
        pattern: "*.{tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - distance_matrix:
        type: file
        description: Distance matrix for clustering (optional)
        pattern: "*.{tsv,txt,mtx}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3916 # MTX
    - sequences:
        type: file
        description: Sequences file for conversion into profile (optional)
        pattern: "*.{fasta,fna,fa}"
        ontologies: []

output:
  output:
    - - meta:
        type: map
        description: |
          Groovy Map containing sample information
      - "reporTree_output/**":
          type: directory
          description: Output directory for ReporTree results
  versions_reporree:
    - - ${task.process}:
        type: string
        description: The process the versions were collected from
      - reportree:
          type: string
          description: The tool name
      - "reporree --version 2>&1 | head -1":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
        type: string
        description: The process the versions were collected from
      - reportree:
          type: string
          description: The tool name
      - "reporree --version 2>&1 | head -1":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@murphygargantua-agent"
maintainers:
  - "@murphygargantua-agent"
