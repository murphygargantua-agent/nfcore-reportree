name: nf-core module tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  nf-core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.7'

      - name: Set up nf-core tools
        run: pip install nf-core==4.1.0

      - name: Install nf-test
        run: |
          mkdir -p /opt/nf-test
          curl -L -o /tmp/nf-test.tar.gz https://github.com/askimed/nf-test/releases/download/v0.9.5/nf-test-0.9.5.tar.gz
          tar -xzf /tmp/nf-test.tar.gz -C /opt/nf-test
          cp /opt/nf-test/nf-test /usr/local/bin/nf-test
          chmod +x /usr/local/bin/nf-test
          nf-test --help

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run nf-core modules lint
        run: nf-core modules lint reportree --dir .

      - name: Run Python unit tests
        run: python3 tests/test_module.py

      - name: Run nf-test (local, no docker)
        run: nf-test test --tag reportree --profile local