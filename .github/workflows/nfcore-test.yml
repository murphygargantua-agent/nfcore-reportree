name: nf-core module tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  nf-core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.7'

      - name: Set up nf-core tools
        run: pip install nf-core==4.1.0

      - name: Install nf-test
        run: |
          curl -L -o /tmp/nf-test.tar.gz https://github.com/askimed/nf-test/releases/download/v0.9.5/nf-test-0.9.5.tar.gz
          mkdir -p ~/.nf-test
          tar -xzf /tmp/nf-test.tar.gz -C ~/.nf-test
          ln -sf ~/.nf-test/nf-test /usr/local/bin/nf-test
          chmod +x ~/.nf-test/nf-test
          NXF_JAVA_HOME=$JAVA_HOME nf-test version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run nf-core modules lint
        run: nf-core modules lint reportree --dir .

      - name: Run Python unit tests
        run: python3 tests/test_module.py

      - name: Run nf-test (local, no docker)
        run: PATH="${GITHUB_WORKSPACE:-.}:$PATH" nf-test test --tag reportree --profile local